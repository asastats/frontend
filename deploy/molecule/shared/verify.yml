---
- name: Verify deployment (backend-independent checks)
  hosts: all:!localhost
  become: true
  gather_facts: false

  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Verify admin user exists (created by createuser role)
      ansible.builtin.command: "id {{ admin_user }}"
      register: admin_user_check
      changed_when: false
      failed_when: admin_user_check.rc != 0

    - name: Assert the web cache Redis instance is running and enabled
      ansible.builtin.assert:
        that:
          - "ansible_facts.services['redis_' + redis_port | string + '.service'].state == 'running'"
          - "ansible_facts.services['redis_' + redis_port | string + '.service'].status == 'enabled'"
        fail_msg: "Web cache Redis (port {{ redis_port }}) is not running or not enabled"
        success_msg: "Web cache Redis (port {{ redis_port }}) is running and enabled"

    - name: "Verify the web cache instance answers on port {{ redis_port }}"
      ansible.builtin.command: >
        redis-cli -p {{ redis_port }} -a {{ redis_password }} ping
      register: redis_ping
      changed_when: false
      failed_when: "'PONG' not in redis_ping.stdout"
      no_log: true

    - name: Verify PostgreSQL user exists
      ansible.builtin.command: >
        psql -U postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='{{ database_user }}'"
      register: user_exists
      changed_when: false
      failed_when: user_exists.stdout.strip() != "1"

    - name: Verify PostgreSQL database exists
      ansible.builtin.command: >
        psql -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='{{ database_name }}'"
      register: db_exists
      changed_when: false
      failed_when: db_exists.stdout.strip() != "1"

    - name: Verify pg_trgm extension enabled
      ansible.builtin.command: >
        psql -U postgres -d {{ database_name }} -tAc "SELECT 1 FROM pg_extension WHERE extname='pg_trgm'"
      register: ext_exists
      changed_when: false
      failed_when: ext_exists.stdout.strip() != "1"

    - name: Verify Gunicorn systemd unit file exists
      ansible.builtin.stat:
        path: "/etc/systemd/system/gunicorn-{{ env_name }}.service"
      register: gunicorn_file

    - name: Assert Gunicorn systemd unit present
      ansible.builtin.assert:
        that:
          - gunicorn_file.stat.exists
        fail_msg: "Gunicorn service file not found at /etc/systemd/system/gunicorn-{{ env_name }}.service"
        success_msg: "Gunicorn service file found"

    - name: Assert the Gunicorn service is running
      ansible.builtin.assert:
        that:
          - "ansible_facts.services['gunicorn-' + env_name + '.service'].state == 'running'"
        fail_msg: "Gunicorn service is not running"
        success_msg: "Gunicorn service is running"

    - name: Fetch the Django about page from nginx to verify the app responds
      ansible.builtin.uri:
        url: "http://localhost/about/"
        return_content: true
        status_code: [200]
      register: verify_about
      changed_when: false

    - name: Ensure about page responded with HTML
      ansible.builtin.assert:
        that:
          - "'<html' in verify_about.content.lower()"
        fail_msg: "Nginx did not return the Django about HTML page."
        success_msg: "Nginx served the Django about page."

    - name: Verify a collected static asset is served
      ansible.builtin.uri:
        url: "http://localhost/static/logo.png"
        status_code: [200]
      register: verify_static_asset
      changed_when: false

    - name: Assert static asset was served
      ansible.builtin.assert:
        that:
          - verify_static_asset.status == 200
        fail_msg: "Collected static asset was not served by nginx."
        success_msg: "Static assets are served by nginx."

    # ── Cross-repo coupling: the api.asastats.com drop-in must be includable ──
    - name: Read the nginx main configuration
      ansible.builtin.slurp:
        path: /etc/nginx/nginx.conf
      register: verify_nginx_conf

    - name: Assert the sites-enabled drop-in include is present
      ansible.builtin.assert:
        that:
          - "'include /etc/nginx/sites-enabled/*;' in (verify_nginx_conf.content | b64decode)"
        fail_msg: >-
          nginx.conf is missing 'include /etc/nginx/sites-enabled/*;' — the backend's
          api.asastats.com server block would not be picked up.
        success_msg: "nginx.conf includes the sites-enabled drop-in directory."

    - name: Dump the effective nginx configuration
      ansible.builtin.command: /usr/local/openresty/nginx/sbin/nginx -T -c /etc/nginx/nginx.conf
      register: verify_nginx_dump
      changed_when: false

    - name: Assert nginx actually loads sites-enabled drop-ins
      ansible.builtin.assert:
        that:
          - "'/etc/nginx/sites-enabled/' in verify_nginx_dump.stdout"
        fail_msg: "nginx is not loading any sites-enabled drop-in; the api site would be ignored."
        success_msg: "nginx loads sites-enabled drop-ins (api site will be honored)."

    # ── Request timings are logged ──────────────────────────────────────────
    - name: Assert the timed log format is defined and used
      ansible.builtin.assert:
        that:
          - "'log_format timed' in verify_nginx_dump.stdout"
          - "'access_log /var/log/nginx/access.log timed' in verify_nginx_dump.stdout"
        fail_msg: >-
          The timed log format is missing, so the access log carries no request
          duration — and worker contention cannot be measured from it at all.
        success_msg: "Requests are logged with their duration."

    - name: Read the last access log line after a request
      ansible.builtin.shell: |
        set -o pipefail
        tail -n 1 /var/log/nginx/access.log
      args:
        executable: /bin/bash
      register: verify_log_line
      changed_when: false

    - name: Assert the logged line actually carries the two timings
      ansible.builtin.assert:
        that:
          - verify_log_line.stdout | regex_search('[0-9]+\\.[0-9]+ ([0-9]+\\.[0-9]+|-)\\s*$')
        fail_msg: >-
          The last log line has no trailing timings, so nginx is writing the stock
          combined format whatever the config says — most likely a second
          access_log on the same level, which accumulates rather than replaces.
          Line was: {{ verify_log_line.stdout }}
        success_msg: "Logged lines carry $request_time and $upstream_response_time."

    # ── The live poll is served by ASGI, not by gunicorn ────────────────────
    - name: Assert the live poll routes to the ASGI upstream
      ansible.builtin.assert:
        that:
          - "'location /widgets/liverefresh/' in verify_nginx_dump.stdout"
        fail_msg: >-
          /widgets/liverefresh/ has no location of its own, so the poll falls through
          to /widgets/ and back onto gunicorn's blocking workers — 4.9% of all traffic,
          growing with readers rather than clicks.
        success_msg: "The live poll has its own location."

    - name: Extract the live poll's location block
      ansible.builtin.set_fact:
        verify_poll_block: >-
          {{ verify_nginx_dump.stdout
             | regex_search('location /widgets/liverefresh/[^}]*}')
             | default('', true) }}

    - name: Assert the poll is not rate limited
      ansible.builtin.assert:
        that:
          - "'limit_req' not in verify_poll_block"
        fail_msg: >-
          The live poll's location carries a limit_req. `zone=main` is 4r/m and the
          poll runs every ~3 s, so a limiter from that zone refuses it continuously —
          and error_page 503 would answer an htmx fragment with an HTML page. The
          first draft of this block had exactly that, copied from the address page.
        success_msg: "The live poll is not rate limited."

    - name: Assert the poll reaches the ASGI upstream rather than gunicorn
      ansible.builtin.assert:
        that:
          - "'channels-backend' in verify_poll_block"
        fail_msg: >-
          The poll's location does not proxy to channels-backend, so it is still on
          gunicorn's blocking workers whatever the location says.
        success_msg: "The live poll proxies to the ASGI upstream."

    # ── The unauthenticated-API throttle ────────────────────────────────────
    # Three separate things have to hold, and each has its own way of being
    # silently wrong: the zone has to exist, the limit has to be keyed so that
    # a credential exempts it, and it must be scoped so the browser's wallet
    # and schema paths are never caught.
    - name: Assert the unauthenticated-API rate limit zone is defined
      ansible.builtin.assert:
        that:
          - "'zone=api_unauth' in verify_nginx_dump.stdout"
          - "'map $http_authorization $api_unauth_key' in verify_nginx_dump.stdout"
        fail_msg: >-
          The api_unauth rate limit zone or its Authorization-keyed map is missing —
          unauthenticated API scraping would be unthrottled.
        success_msg: "The unauthenticated-API rate limit zone is defined."

    - name: Assert the throttle is scoped to address-shaped API paths only
      ansible.builtin.assert:
        that:
          - "'^/api/v2/[A-Z2-7]{58}(/|$)' in verify_nginx_dump.stdout"
        fail_msg: >-
          The api_unauth limit is not scoped to address-shaped paths. Applied to all of
          /api/, it throttles the browser's wallet login flow (/api/v2/wallet/nonce/,
          /verify/, /wallets/), which sends a session cookie and no Authorization header.
        success_msg: "The unauthenticated-API throttle is scoped to address-shaped paths."

    - name: Fetch a wallet endpoint repeatedly to prove it is not throttled
      ansible.builtin.uri:
        url: "http://localhost/api/v2/wallet/wallets/"
        status_code: [200, 401, 403, 404, 405]
      register: verify_wallet_unthrottled
      changed_when: false
      loop: "{{ range(0, 12) | list }}"

    - name: Assert no wallet request was rate limited
      ansible.builtin.assert:
        that:
          - verify_wallet_unthrottled.results | map(attribute='status') | select('equalto', 429) | list | length == 0
        fail_msg: >-
          A /api/v2/wallet/ request was answered 429. The throttle is catching the
          browser's sign-in flow — check the location regex.
        success_msg: "The wallet endpoints are outside the throttle."
