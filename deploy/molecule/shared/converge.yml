---
# ──────────────────────────────────────────────
# PLAY 1: Load env_vars on localhost and export
# ──────────────────────────────────────────────
- name: Load environment from .env files (Molecule)
  hosts: localhost
  connection: local
  gather_facts: false
  run_once: true

  vars:
    env_files:
      # first, so a real env file below overrides anything it also defines
      - "{{ playbook_dir }}/.env.molecule"
      - "{{ playbook_dir }}/../../.env.testing"
      - "{{ playbook_dir }}/../../../website/.env.testing"

  tasks:
    - name: Stat env files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ env_files }}"
      register: env_file_check

    - name: Note which env files are present
      ansible.builtin.set_fact:
        env_files_present: >-
          {{ env_file_check.results | selectattr('stat.exists')
             | map(attribute='item') | list }}

    # Shared .env.molecule is required for provisioning
    # docs/logbook.md#deploymoleculesharedconvergeyml
    - name: Every scenario needs the shared defaults file
      ansible.builtin.assert:
        that: env_files_present | select('search', '\.env\.molecule$') | list | length > 0
        fail_msg: >-
          The shared .env.molecule was not found. Looked for: {{ env_files }}.
          Found: {{ env_files_present | default([]) }}. It is committed at
          deploy/molecule/shared/.env.molecule, so if it is missing here this
          checkout is incomplete rather than misconfigured -- provisioning
          cannot finish without the settings manage.py refuses to run without.

    # `assert`'s success_msg only shows under -v, and which env files a run
    # loaded is the first thing anyone reading a provisioning failure wants.
    - name: Env files this run loaded
      ansible.builtin.debug:
        msg: "{{ env_files_present }}"

    - name: Slurp existing env files
      ansible.builtin.slurp:
        path: "{{ item.item }}"
      when: item.stat.exists
      loop: "{{ env_file_check.results }}"
      register: env_slurped

    # dotenv parsing: inline comments != value; empty != absent
    # docs/logbook.md#deploymoleculesharedconvergeyml
    - name: Convert dotenv to dict
      ansible.builtin.set_fact:
        env_vars: >-
          {{ (blanks | combine(env_vars | default({}))) | combine(values) }}
      loop: "{{ env_slurped.results }}"
      when: item.skipped is not defined
      vars:
        decoded: "{{ item.content | b64decode }}"
        yaml_style: |
          {% for line in decoded.splitlines() %}
          {%   set stripped = line.strip() %}
          {%   if stripped and not stripped.startswith('#') and '=' in stripped %}
          {%     set key = stripped.split('=', 1)[0] | trim %}
          {%     set rest = stripped.split('=', 1)[1] %}
          {#     Stripped BEFORE trimming: the example writes the comment on a #}
          {#     line whose value is blank, so trimming first would leave the  #}
          {#     '#' at the start with no whitespace in front of it to match.  #}
          {#     A quoted value keeps everything inside the quotes, '#' too.   #}
          {%     set value = (rest | trim) if (rest | trim)[:1] in ['"', "'"]
                             else rest | regex_replace('(^|[ \t])#.*$', '') | trim %}
          {%     if key %}
          {{ key }}: {{ value | to_json }}
          {%     endif %}
          {%   endif %}
          {% endfor %}
        parsed_one: "{{ yaml_style | from_yaml | default({}, true) }}"
        entries: "{{ parsed_one | dict2items }}"
        values: "{{ entries | rejectattr('value', 'eq', '') | list | items2dict }}"
        blanks: "{{ entries | selectattr('value', 'eq', '') | list | items2dict }}"

    - name: Export env_vars to localhost
      ansible.builtin.add_host:
        name: localhost
        env_vars: "{{ env_vars }}"
      changed_when: false

    - name: Set remote hosts SSH user (skip localhost)
      ansible.builtin.add_host:
        name: "{{ item }}"
        ansible_user: "{{ hostvars['localhost'].env_vars.ADMIN_USER }}"
      loop: "{{ groups['all'] }}"
      when: item != 'localhost'
      changed_when: false

    - name: Fix localhost connection — prevent SSH attempts
      ansible.builtin.add_host:
        name: localhost
        ansible_connection: local
      when: inventory_hostname != "localhost"

# ──────────────────────────────────────────────
# PLAY 2: Bootstrap admin user inside Molecule instance
# ──────────────────────────────────────────────
- name: Ensure admin user exists (Molecule only)
  hosts: all:!localhost
  gather_facts: false
  become: true
  roles:
    - createuser

# ──────────────────────────────────────────────
# PLAY 3: Provision roles
# ──────────────────────────────────────────────
- name: Provisioning of the portfolio tracker website
  hosts: all:!localhost
  gather_facts: true
  roles:
    - setuphost
    - redis
    - postgresql
    - projectsetup
    - gunicorn
    - nginx
    - hardening
