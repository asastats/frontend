---
- name: Run converge
  import_playbook: "../shared/converge.yml"
  vars:
    env_files:
      # first, so a real env file below overrides anything it also defines
      - "{{ playbook_dir }}/../shared/.env.molecule"
      - "{{ playbook_dir }}/../../.env.production"
      - "{{ playbook_dir }}/../../../website/.env.production"
