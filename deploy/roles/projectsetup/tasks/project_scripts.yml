---
- name: Create project management command scripts
  ansible.builtin.template:
    src: managementcommand.sh
    dest: "{{ site_path }}/scripts/{{ item }}.sh"
    owner: "{{ webapp_user }}"
    group: "{{ webapp_group }}"
    mode: "0700"
  loop:
    - migrate
    - collectstatic
    - clearsessions
  become: true
  become_user: "{{ webapp_user }}"
  tags: [project-setup, create-scripts]

- name: Run migrate management command
  ansible.builtin.shell: |
    set -o pipefail
    echo "yes" | ./migrate.sh
  args:
    chdir: "{{ site_path }}/scripts/"
    executable: /bin/bash
  become: true
  become_user: "{{ webapp_user }}"
  register: projectsetup_migrate_command
  changed_when: "'No migrations to apply' not in projectsetup_migrate_command.stdout"
  tags: [project-setup, postgresql-create, run-project-scripts, update-project-code]

# Minify our own JavaScript before collectstatic runs. static/build is placed
# first in STATICFILES_DIRS in production, so collectstatic prefers the
# minified copy over the readable source of the same name.
#
# **That preference is why a failed build is worse than no build.** static/build
# is gitignored and survives between deploys, so a build that does not run
# leaves the PREVIOUS release's JavaScript in place and collectstatic keeps
# choosing it, over the source that was just pulled. The site then serves last
# release's scripts and nothing anywhere reports a problem.
#
# This used to carry `failed_when: false`, which made exactly that outcome
# invisible: no node, or no route to the npm registry for `npx esbuild`, and the
# task reported ok while the deploy went green on stale code.
- name: Check whether the static build script is present
  ansible.builtin.stat:
    path: "{{ site_path }}/source/{{ app_name }}/build-static.sh"
  register: projectsetup_build_static_script
  tags: [project-setup, run-project-scripts, update-project-code]

# The honest form of "ships readable sources, which is larger but correct":
# that is only true once the stale build output is gone. Left in place it is
# not a fallback, it is the bug above.
- name: Drop stale minified assets when there is no script to rebuild them
  ansible.builtin.file:
    path: "{{ site_path }}/source/{{ app_name }}/static/build"
    state: absent
  become: true
  become_user: "{{ webapp_user }}"
  when: not projectsetup_build_static_script.stat.exists
  tags: [project-setup, run-project-scripts, update-project-code]

- name: Build minified static assets
  ansible.builtin.shell: |
    set -o pipefail
    ./build-static.sh
  args:
    chdir: "{{ site_path }}/source/{{ app_name }}/"
    executable: /bin/bash
  become: true
  become_user: "{{ webapp_user }}"
  register: projectsetup_build_static
  changed_when: "'minified' in projectsetup_build_static.stdout"
  # Both halves are needed. `rc` alone passes a script that exits 0 having
  # minified nothing; the stdout check alone would not notice a crash, and
  # naming `failed_when` at all replaces the default rc check rather than
  # adding to it.
  failed_when: >-
    projectsetup_build_static.rc != 0
    or 'minified' not in projectsetup_build_static.stdout
  when: projectsetup_build_static_script.stat.exists
  tags: [project-setup, run-project-scripts, update-project-code]

# collectstatic must precede the gunicorn restart, not follow it: under
# ManifestStaticFilesStorage `{% static %}` raises for anything missing from
# staticfiles.json, so a worker serving pages before the manifest is written
# returns 500s rather than merely unstyled pages.
#
# Deliberately no `--clear`: old hashed files should accumulate, so a reader
# holding a page rendered by the previous release can still fetch its assets.
- name: Run collectstatic management command
  ansible.builtin.shell: |
    set -o pipefail
    echo "yes" | ./collectstatic.sh
  args:
    chdir: "{{ site_path }}/scripts/"
    executable: /bin/bash
  become: true
  become_user: "{{ webapp_user }}"
  register: projectsetup_collectstatic_command
  changed_when: "'0 static files copied to' not in projectsetup_collectstatic_command.stdout"
  tags: [project-setup, run-project-scripts, update-project-code]

- name: Ensure SHELL variable is present in crontab
  ansible.builtin.cron:
    name: SHELL
    env: true
    value: /bin/bash
  become: true
  become_user: "{{ webapp_user }}"
  tags: [project-setup, cronjobs]

- name: Create weekly clearsessions cron job
  ansible.builtin.cron:
    weekday: "2"
    hour: "5"
    minute: "47"
    name: "{{ project_name }} clearsessions (weekly)"
    user: "{{ webapp_user }}"
    job: ": Clear sessions weekly ; /usr/bin/nice -n 10 {{ site_path }}/scripts/clearsessions.sh"
  become: true
  tags: [project-setup, cronjobs]

- name: Create output-checked management command cron scripts
  ansible.builtin.template:
    src: managementcommandoutputcron.sh
    dest: "{{ site_path }}/scripts/{{ item.name }}cron.sh"
    owner: "{{ webapp_user }}"
    group: "{{ webapp_group }}"
    mode: "0700"
  become: true
  become_user: "{{ webapp_user }}"
  loop:
    - { name: deletedeactivated, output: '$output == "0 deactivated accounts deleted!"' }
    - { name: checkpublicbundles, output: '$output == "No changes"' }
  tags: [project-setup, cronjobs]

- name: Create weekly delete-deactivated-accounts cron job
  ansible.builtin.cron:
    weekday: "3"
    hour: "23"
    minute: "20"
    name: "{{ project_name }} delete deactivated accounts (weekly)"
    user: "{{ webapp_user }}"
    job: ": Delete deactivated accounts weekly ; {{ site_path }}/scripts/deletedeactivatedcron.sh"
  become: true
  tags: [project-setup, cronjobs]

- name: Create check-public-bundles cron job (every 5 minutes)
  ansible.builtin.cron:
    weekday: "*"
    hour: "*"
    minute: "*/5"
    name: "{{ project_name }} check public bundles"
    user: "{{ webapp_user }}"
    job: ": Check public bundles ; {{ site_path }}/scripts/checkpublicbundlescron.sh"
  become: true
  tags: [project-setup, cronjobs, public-bundles]

- name: Set the django_site record to "{{ site_name }}"
  community.postgresql.postgresql_query:
    login_db: "{{ hostvars['localhost'].env_vars.DATABASE_NAME }}"
    login_user: postgres
    query: "UPDATE django_site SET domain = %s, name = %s WHERE id = 1"
    positional_args:
      - "www.{{ site_name }}"
      - "ASA Stats"
  become: true
  become_user: postgres
  when:
    - postgresql_database_created is defined
    - postgresql_database_created is changed
    - "'No migrations to apply' not in projectsetup_migrate_command.stdout"
  tags: [project-setup, postgresql-create]
