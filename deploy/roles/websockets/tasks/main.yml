---
# Django Channels via Daphne under Supervisor
# docs/logbook.md#deployroleswebsocketstasksmainyml
- name: Ensure supervisor is installed
  ansible.builtin.apt:
    name: supervisor
    state: present
  become: true
  tags: [channels, supervisor]

- name: Ensure supervisor is started and enabled
  ansible.builtin.systemd:
    name: supervisor
    state: started
    enabled: true
  become: true
  tags: [channels, supervisor]

- name: Install the Daphne rolling restart (asgir) and status alias (sasgi)
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  become: true
  loop:
    - { src: asgir.sh, dest: /usr/local/bin/asgir, mode: "0755" }
    - { src: asgi-profile.sh, dest: /etc/profile.d/asgi.sh, mode: "0644" }
  tags: [channels, daphne]

- name: Write the Daphne supervisor configuration
  ansible.builtin.template:
    src: daphne-supervisor.conf
    dest: "/etc/supervisor/conf.d/daphne-{{ env_name }}.conf"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: "Reload daphne"
  tags: [channels, daphne]

- name: Install logrotate config for asgi.log
  ansible.builtin.template:
    src: asgi-logrotate
    dest: "/etc/logrotate.d/daphne-{{ env_name }}-asgi"
    owner: root
    group: root
    mode: "0644"
  become: true
  tags: [channels, daphne, logrotate]
