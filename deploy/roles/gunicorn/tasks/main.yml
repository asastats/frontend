---
- name: Write systemd gunicorn init script
  ansible.builtin.template:
    src: gunicorn-systemd.service
    dest: "/etc/systemd/system/gunicorn-{{ env_name }}.service"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: "Enable and restart gunicorn"
  tags: [gunicorn]

- name: Ensure gunicorn is running and enabled
  ansible.builtin.systemd:
    name: "gunicorn-{{ env_name }}"
    state: started
    enabled: true
    daemon_reload: true
  become: true
  tags: [gunicorn]
