# **Set here, at server level, and that placement is the point.** Two
# `access_log` directives on the *same* level accumulate - nginx writes the line
# twice, once per format - and the stock `access_log` lives in `/etc/nginx/nginx.conf`,
# which this role patches in place rather than templating. A server-level
# directive replaces the inherited one instead of adding to it, so the file gets
# one line per request in the `timed` format and nothing else has to be edited.
#
# The path is the distro default deliberately: every capture, rotation rule and
# analysis script in `post-deploy/` already points at it.
access_log /var/log/nginx/access.log timed;

# error_log {{ site_path }}/logs/nginx-error.log;

include /etc/nginx/snippets/favicon.conf;

location = /robots.txt {
    alias {{ site_path }}/source/{{ app_name }}/templates/robots.txt;
}

error_page 400 401 403 404 /404.html;
location = /404.html {
    root {{ site_path }}/source/{{ app_name }}/templates/;
}

location = /403_csrf.html {
    root {{ site_path }}/source/{{ app_name }}/templates/;
}

error_page 500 502 504 /500.html;
location = /500.html {
    root {{ site_path }}/source/{{ app_name }}/templates/;
}

error_page 503 /503r.html;
location = /503r.html {
    root {{ site_path }}/source/{{ app_name }}/templates/;
}

# Asset icons and NFT thumbnails are served from the CDN now -- see
# `asa_icon` / `provider_icon` in core/templatetags/core_extras.py, which emit
# absolute BASE_CDN_URL paths. The /static/icons/ and /static/thumbnails/
# blocks that used to live here are gone with them; their `try_files` fallback
# to empty.png was, by the end, the only thing still answering those urls.

# Content-hashed assets, named <file>.<12 hex>.<ext> by Django's
# ManifestStaticFilesStorage. The name changes whenever the content does, so
# these can never go stale and are safe to cache indefinitely.
#
# `root` rather than `alias`, and only here: nginx requires an `alias` inside a
# regex location to refer to captures from that regex, and this pattern has
# none. `root {{ site_path }}` appends the whole URI, so /static/js/x.abc123.js
# resolves to {{ site_path }}/static/js/x.abc123.js -- the same file the
# `alias {{ site_path }}/static` block below serves. The prefix block keeps
# `alias` precisely because the two are not interchangeable in general: they
# only agree here because the location prefix is the alias path's last
# segment, and changing a working production rule for symmetry would be a
# needless risk.
location ~ "^/static/.+\.[0-9a-f]{12}\.[^./]+$" {
    root {{ site_path }};
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# collectstatic keeps the unhashed copy alongside the hashed one, and anything
# still addressed by a mutable name lands here. Unchanged from before: `alias`,
# ten days.
location /static {
    # autoindex on;
    alias {{ site_path }}/static;
    expires 10d;
}

# Root page
location = / {
    proxy_pass http://unix:{{ site_path }}/run/{{ site_name }}.socket;
    include /etc/nginx/snippets/proxy_headers.conf;
    proxy_buffers 8 24k;
    proxy_buffer_size 2k;
    proxy_read_timeout 241;
}

# Address-shaped API reads: /api/v2/<58-char Algorand address>/...
#
# Matched case-sensitively on the base32 alphabet (A-Z and 2-7) so this cannot
# catch anything else under /api/v2/ -- not /wallet/, /schema/, /settings/ or
# /internal/, all of which the browser or our own server reaches without an
# Authorization header and none of which the scraper asks for.
#
# Requests here are limited only when they carry no credential, per the
# $api_unauth_key map in the http block. An unauthenticated read of this API is
# answered 401 whatever happens, so the throttle costs a real caller nothing:
# the burst is more than enough to see the error and go and get a token.
#
# 429 rather than nginx's default 503, because this is a machine-facing path
# and 429 is the answer a client can act on. It also sidesteps `error_page 503`
# above, which would otherwise return an HTML page to a JSON client.
location ~ "^/api/v2/[A-Z2-7]{58}(/|$)" {
    limit_req zone=api_unauth burst=5 nodelay;
    limit_req_status 429;

    ## Prevent "Invalid HTTP_HOST header ..." message
    if ( $host !~* ^({{ site_name }}|www.{{ site_name }}|{{ inventory_hostname }}|localhost)$ ) {
        return 444;
    }
    proxy_buffers 8 24k;
    proxy_buffer_size 2k;
    proxy_read_timeout 241;
    include /etc/nginx/snippets/proxy_headers.conf;
    proxy_pass http://unix:{{ site_path }}/run/{{ site_name }}.socket;
}

# Global bundle slug -> hash (OpenResty Lua)
location ~* ^/([A-Za-z0-9._-]+)/?$ {
    set $slug $1;

    access_by_lua_block {
        local slug = ngx.var.slug
        slug = string.lower(slug)
        local dict = ngx.shared.bundle_hash_map
        local hash = dict:get(slug)

        if hash then
            return ngx.exec("/" .. hash)
        end
    }

    # Prevent nginx from trying to serve static files
    try_files "" @fallback;
}

location ~* "^/([a-zA-Z0-9]{40}|[a-zA-Z0-9]{58})" {
    ## Prevent "Invalid HTTP_HOST header ..." message
    if ( $host !~* ^({{ site_name }}|www.{{ site_name }}|{{ inventory_hostname }}|localhost)$ ) {
        return 444;
    }
    limit_req zone=main burst=5;
    proxy_buffers 8 24k;
    proxy_buffer_size 2k;
    proxy_read_timeout 241;
    include /etc/nginx/snippets/proxy_headers.conf;
    proxy_pass http://unix:{{ site_path }}/run/{{ site_name }}.socket;
}

# **The live poll goes to the ASGI server, not to gunicorn.**
#
# Measured over nine days of access logs: 35,920 requests, 4.9% of everything,
# and it grows with *readers* rather than with clicks - a single open live page
# is about 1,200 requests an hour whether or not anybody touches it. Every one
# of those took one of `gunicorn_workers` (13) sync workers, each of which
# blocks for the whole request, on a box where an address page already holds
# one for ~2.2 s.
#
# The poll is the right shape to move: a Redis read and a fragment render, all
# I/O. Django runs a *sync* view under ASGI inside `ThreadSensitiveContext`,
# which Django 5.2 opens per request - so these run concurrently in threads and
# nothing had to be rewritten as async. An async view calling this code would
# have been worse than a sync worker, because blocking the loop stalls every
# request sharing the process.
#
# `channels-backend` and daphne already exist for websockets, and `config/asgi.py`
# already routes `"http"` to Django - so this is a location, not a deployment.
#
# Longer prefix than `/widgets/` below, so nginx prefers it. No `$http_upgrade`
# branch is needed here: daphne is a `ProtocolTypeRouter` and serves both.
# **No `limit_req` here, and that is deliberate.** `zone=main` is 4r/m per
# address; the poll runs every ~3 s, which is 20/m for one reader with one tab
# open. Copying the address page's limiter onto it - which the first draft of
# this block did - would 503 the live refresh continuously, and `error_page 503`
# above would answer an htmx fragment request with an HTML page.
location /widgets/liverefresh/ {
    include /etc/nginx/snippets/proxy_headers.conf;
    proxy_buffers 8 24k;
    proxy_buffer_size 2k;
    proxy_read_timeout 241;
    proxy_pass http://channels-backend;
}

# The swap widget's two engine-data calls, moved for the same reason and
# measured to be almost nothing: 24 requests in nine days against the poll's
# 35,920. They are here because they are the same *shape* - a keystroke search
# and a holdings refresh, both short and both I/O - not because they are a
# load today.
location /widgets/swapcore/ {
    include /etc/nginx/snippets/proxy_headers.conf;
    proxy_buffers 8 24k;
    proxy_buffer_size 2k;
    proxy_read_timeout 241;
    proxy_pass http://channels-backend;
}

location /widgets/ {
    # A real WebSocket handshake has `Upgrade: websocket` -> send it to Daphne.
    # Everything else here -> WSGI. The live poll and the swap widget's
    # engine-data calls no longer arrive here at all; they match the longer
    # prefixes above and go to Daphne over HTTP.
    if ($http_upgrade) { return 418; }
    error_page 418 = @widgets_ws;
    recursive_error_pages on;

    proxy_pass http://unix:{{ site_path }}/run/{{ site_name }}.socket;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffers 8 24k;
    proxy_buffer_size 2k;
    proxy_read_timeout 241;
}

location @widgets_ws {
    proxy_pass http://channels-backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_read_timeout 241;
}

location @fallback {
    ## Prevent "Invalid HTTP_HOST header ..." message
    if ( $host !~* ^({{ site_name }}|www.{{ site_name }}|{{ inventory_hostname }}|localhost)$ ) {
        return 444;
    }
    proxy_buffers 8 24k;
    proxy_buffer_size 2k;
    proxy_read_timeout 241;
    include /etc/nginx/snippets/proxy_headers.conf;
    proxy_pass http://unix:{{ site_path }}/run/{{ site_name }}.socket;
}

# https://lincolnloop.com/blog/rate-limiting-nginx/
location /accounts/login/ {
    # apply rate limiting
    limit_req zone=login burst=5;

    # boilerplate copied from location /
    proxy_buffers 8 24k;
    proxy_buffer_size 2k;
    include /etc/nginx/snippets/proxy_headers.conf;
    proxy_pass http://unix:{{ site_path }}/run/{{ site_name }}.socket;
}

# --- Catch-all for normal paths ---
location / {
    try_files $uri $uri/ @fallback;
}
