# Server level on purpose: it replaces the inherited `access_log` instead of
# adding a second line per request. The path is the distro default; `post-deploy/`
# scripts read it.
# docs/logbook.md#deployrolesnginxtemplatessite_server_blockconf-long-comments-2026-10-31
access_log /var/log/nginx/access.log timed;

# error_log {{ site_path }}/logs/nginx-error.log;

include /etc/nginx/snippets/favicon.conf;

location = /robots.txt {
    alias {{ site_path }}/source/{{ app_name }}/templates/robots.txt;
}

error_page 400 401 403 404 /404.html;
location = /404.html {
    root {{ site_path }}/source/{{ app_name }}/templates/;
}

location = /403_csrf.html {
    root {{ site_path }}/source/{{ app_name }}/templates/;
}

error_page 500 502 504 /500.html;
location = /500.html {
    root {{ site_path }}/source/{{ app_name }}/templates/;
}

error_page 503 /503r.html;
location = /503r.html {
    root {{ site_path }}/source/{{ app_name }}/templates/;
}

# Content-hashed assets, cached for a year. `root`, not `alias`: an `alias` in a
# regex location must use that regex's captures.
# docs/logbook.md#deployrolesnginxtemplatessite_server_blockconf-long-comments-2026-10-31
location ~ "^/static/.+\.[0-9a-f]{12}\.[^./]+$" {
    root {{ site_path }};
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
}

location /static {
    # autoindex on;
    alias {{ site_path }}/static;
    expires 10d;
}

# Root page
location = / {
    proxy_pass http://unix:{{ site_path }}/run/{{ site_name }}.socket;
    include /etc/nginx/snippets/proxy_headers.conf;
    proxy_buffers 8 24k;
    proxy_buffer_size 2k;
    proxy_read_timeout 241;
}

# Address-shaped API reads, limited only when unauthenticated ($api_unauth_key).
# 429, not 503, so `error_page 503` never serves HTML to a JSON client.
# docs/logbook.md#deployrolesnginxtemplatessite_server_blockconf-long-comments-2026-10-31
location ~ "^/api/v2/[A-Z2-7]{58}(/|$)" {
    limit_req zone=api_unauth burst=5 nodelay;
    limit_req_status 429;

    ## Prevent "Invalid HTTP_HOST header ..." message
    if ( $host !~* ^({{ site_name }}|www.{{ site_name }}|{{ inventory_hostname }}|localhost)$ ) {
        return 444;
    }
    proxy_buffers 8 24k;
    proxy_buffer_size 2k;
    proxy_read_timeout 241;
    include /etc/nginx/snippets/proxy_headers.conf;
    proxy_pass http://unix:{{ site_path }}/run/{{ site_name }}.socket;
}

# Global bundle slug -> hash (OpenResty Lua)
# This, not the address location below, serves /<address> and /<hash>: the
# first matching regex wins. Hence zone=main here; see $main_limit_key.
location ~* ^/([A-Za-z0-9._-]+)/?$ {
    limit_req zone=main burst=5 nodelay;
    set $slug $1;

    access_by_lua_block {
        local slug = ngx.var.slug
        slug = string.lower(slug)
        local dict = ngx.shared.bundle_hash_map
        local hash = dict:get(slug)

        if hash then
            return ngx.exec("/" .. hash)
        end
    }

    # Prevent nginx from trying to serve static files
    try_files "" @fallback;
}

location ~* "^/([a-zA-Z0-9]{40}|[a-zA-Z0-9]{58})" {
    ## Prevent "Invalid HTTP_HOST header ..." message
    if ( $host !~* ^({{ site_name }}|www.{{ site_name }}|{{ inventory_hostname }}|localhost)$ ) {
        return 444;
    }
    limit_req zone=main burst=5 nodelay;
    proxy_buffers 8 24k;
    proxy_buffer_size 2k;
    proxy_read_timeout 241;
    include /etc/nginx/snippets/proxy_headers.conf;
    proxy_pass http://unix:{{ site_path }}/run/{{ site_name }}.socket;
}

# Live poll -> Daphne, not gunicorn. No `limit_req`: the ~3 s poll would trip
# zone=main and `error_page 503` would answer htmx with HTML.
# docs/logbook.md#deployrolesnginxtemplatessite_server_blockconf-long-comments-2026-10-31
location /widgets/liverefresh/ {
    include /etc/nginx/snippets/proxy_headers.conf;
    proxy_buffers 8 24k;
    proxy_buffer_size 2k;
    proxy_read_timeout 241;

    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 15s;

    proxy_pass http://channels-backend;
}

# Same shape as the live poll, so Daphne over HTTP too.
location /widgets/swapcore/ {
    include /etc/nginx/snippets/proxy_headers.conf;
    proxy_buffers 8 24k;
    proxy_buffer_size 2k;
    proxy_read_timeout 241;
    proxy_pass http://channels-backend;
}

location /widgets/ {
    # `Upgrade: websocket` -> Daphne, the rest -> WSGI; liverefresh/ and swapcore/
    # match longer prefixes above.
    if ($http_upgrade) { return 418; }
    error_page 418 = @widgets_ws;
    recursive_error_pages on;

    proxy_pass http://unix:{{ site_path }}/run/{{ site_name }}.socket;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffers 8 24k;
    proxy_buffer_size 2k;
    proxy_read_timeout 241;
}

location @widgets_ws {
    proxy_pass http://channels-backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_read_timeout 241;
}

location @fallback {
    ## Prevent "Invalid HTTP_HOST header ..." message
    if ( $host !~* ^({{ site_name }}|www.{{ site_name }}|{{ inventory_hostname }}|localhost)$ ) {
        return 444;
    }
    proxy_buffers 8 24k;
    proxy_buffer_size 2k;
    proxy_read_timeout 241;
    include /etc/nginx/snippets/proxy_headers.conf;
    proxy_pass http://unix:{{ site_path }}/run/{{ site_name }}.socket;
}

# https://lincolnloop.com/blog/rate-limiting-nginx/
location /accounts/login/ {
    # apply rate limiting
    limit_req zone=login burst=5;

    # boilerplate copied from location /
    proxy_buffers 8 24k;
    proxy_buffer_size 2k;
    include /etc/nginx/snippets/proxy_headers.conf;
    proxy_pass http://unix:{{ site_path }}/run/{{ site_name }}.socket;
}

# The app's Universal Links / App Links documents (core.views_app): straight to
# Django, no try_files, because Apple refuses a redirect.
location = /.well-known/apple-app-site-association {
    include /etc/nginx/snippets/proxy_headers.conf;
    proxy_pass http://unix:{{ site_path }}/run/{{ site_name }}.socket;
}
location = /.well-known/assetlinks.json {
    include /etc/nginx/snippets/proxy_headers.conf;
    proxy_pass http://unix:{{ site_path }}/run/{{ site_name }}.socket;
}

# --- Catch-all for normal paths ---
location / {
    try_files $uri $uri/ @fallback;
}
