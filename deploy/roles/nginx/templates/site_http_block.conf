# Appended to the stock `combined` format, never inserted: scripts count on `$4`
# being the timestamp. `$request_time` includes the client; `$upstream_response_time`
# is how long a worker was held.
# docs/logbook.md#deployrolesnginxtemplatessite_http_blockconf-long-comments-2026-10-31
log_format timed '$remote_addr - $remote_user [$time_local] '
                 '"$request" $status $body_bytes_sent '
                 '"$http_referer" "$http_user_agent" '
                 '$request_time $upstream_response_time';

# https://lincolnloop.com/blog/rate-limiting-nginx/
# Keyed only for address/hash paths, so the slug location can carry it too;
# any other path gets an empty key, which limit_req exempts. See docs/logbook.md.
map $uri $main_limit_key {
    "~*^/([a-zA-Z0-9]{40}|[a-zA-Z0-9]{58})" $binary_remote_addr;
    default "";
}

limit_req_zone $main_limit_key zone=main:10m rate=4r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=4r/m;

# Unauthenticated reads of the address API. The key is the client address only
# without an Authorization header; an empty key is exempt. The server block scopes
# it to address-shaped paths, because wallet login and Swagger send a cookie, not
# the header. docs/logbook.md#deployrolesnginxtemplatessite_http_blockconf-long-comments-2026-10-31
map $http_authorization $api_unauth_key {
    ""      $binary_remote_addr;
    default "";
}

limit_req_zone $api_unauth_key zone=api_unauth:10m rate=10r/m;

client_header_timeout 15;
client_body_timeout 15;
send_timeout 90;

client_body_buffer_size 128k;
client_max_body_size 50m;
client_header_buffer_size 1k;
large_client_header_buffers 4 4k;
output_buffers 1 32k;
postpone_output 1460;

gzip_vary on;
gzip_min_length 300;
gzip_comp_level 3;
gzip_proxied expired no-cache no-store private auth;
gzip_types text/plain;
gzip_types text/css;
gzip_types text/javascript;
gzip_types text/xml;
gzip_types application/x-javascript;
gzip_types application/javascript;
gzip_types application/json;
gzip_types application/xml;
gzip_types application/xml+rss;

open_file_cache max=2000 inactive=20s;
open_file_cache_valid 60s;
open_file_cache_min_uses 5;
open_file_cache_errors off;
