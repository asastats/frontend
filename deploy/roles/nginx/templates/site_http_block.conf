# https://lincolnloop.com/blog/rate-limiting-nginx/
limit_req_zone $binary_remote_addr zone=main:10m rate=4r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=4r/m;

# Unauthenticated reads of the address API.
#
# Measured over nine days of access logs, 2026-09-20: 342,704 of 459,984
# requests to /api/v2 -- 75% -- came from a single scraper rotating two AWS
# us-east-2 hosts, and **not one of them was ever served a 200**. It polls a
# fixed set of addresses on a 61-second cycle, enumerates tens of thousands
# more, and pays twice for every poll because it never learns the trailing
# slash and Django answers APPEND_SLASH with a 301. See
# post-deploy/FINDING-the-401-wall.md.
#
# The key is the client address ONLY when the request carries no Authorization
# header. An empty key is exempt from limit_req entirely, so every
# authenticated caller -- the website's own server-side client, the mobile app,
# third-party integrations -- is untouched **by construction** rather than by
# an allowlist somebody has to maintain as callers come and go.
#
# This alone would be too blunt, because the browser reaches parts of /api/v2
# with a session cookie and no header: the wallet login and link flows
# (/api/v2/wallet/nonce/, /verify/, /wallets/) and the Swagger and Redoc
# schema pages. Throttling those would break signing in. So the limit is also
# scoped, in the server block, to address-shaped paths only -- which is exactly
# and only what the scraper asks for.
map $http_authorization $api_unauth_key {
    ""      $binary_remote_addr;
    default "";
}

limit_req_zone $api_unauth_key zone=api_unauth:10m rate=10r/m;

client_header_timeout 15;
client_body_timeout 15;
send_timeout 90;

client_body_buffer_size 128k;
client_max_body_size 50m;
client_header_buffer_size 1k;
large_client_header_buffers 4 4k;
output_buffers 1 32k;
postpone_output 1460;

gzip_vary on;
gzip_min_length 300;
gzip_comp_level 3;
gzip_proxied expired no-cache no-store private auth;
gzip_types text/plain;
gzip_types text/css;
gzip_types text/javascript;
gzip_types text/xml;
gzip_types application/x-javascript;
gzip_types application/javascript;
gzip_types application/json;
gzip_types application/xml;
gzip_types application/xml+rss;

open_file_cache max=2000 inactive=20s;
open_file_cache_valid 60s;
open_file_cache_min_uses 5;
open_file_cache_errors off;
