---
- name: Check if we already have a certificate
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ site_name }}/fullchain.pem"
  become: true
  register: nginx_cert_stat
  tags: [nginx, letsencrypt]

- name: Set variable indicating whether we need certificate creation
  ansible.builtin.set_fact:
    nginx_need_certs: >-
      {{
        not is_molecule_test | default(false)
        and inventory_hostname in groups['production']
        and not nginx_cert_stat.stat.exists
      }}
  tags: [nginx, letsencrypt]

- name: "Add httponly config to nginx sites-available for {{ site_name }}"
  ansible.builtin.template:
    src: nginx.httponly.conf
    dest: "/etc/nginx/sites-available/{{ site_name }}"
    owner: root
    group: root
    mode: '0640'
    force: false
  become: true
  when: nginx_need_certs
  tags: [nginx, letsencrypt]

- name: "Add http-only config to nginx sites-available for {{ site_name }}"
  ansible.builtin.template:
    src: nginx.http-only.conf
    dest: "/etc/nginx/sites-available/{{ site_name }}"
    owner: root
    group: root
    mode: '0640'
  become: true
  when: is_molecule_test | default(false) or inventory_hostname in groups['testing']
  tags: [nginx, letsencrypt]

- name: "Add symlink to nginx sites-enabled for {{ site_name }}"
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ site_name }}"
    dest: "/etc/nginx/sites-enabled/{{ site_name }}"
    state: link
    owner: root
    group: root
    mode: '0640'
  become: true
  when: nginx_need_certs or
        is_molecule_test | default(false) or
        inventory_hostname in groups['testing']
  notify: Restart openresty
  tags: [nginx, letsencrypt]

- name: Generate Let's Encrypt certificate
  ansible.builtin.command: >
    certbot certonly --non-interactive --agree-tos --no-eff-email
    --email {{ admin_email }}
    -a webroot --webroot-path /var/www/letsencrypt
    -d {{ site_name }} -d www.{{ site_name }}
  become: true
  when:
    - nginx_need_certs
    - test is not defined
  changed_when: false
  tags: [nginx, letsencrypt]

- name: "Remove httponly config from sites-enabled for {{ site_name }}"
  ansible.builtin.file:
    path: "/etc/nginx/sites-enabled/{{ site_name }}"
    state: absent
  become: true
  when: nginx_need_certs
  notify: Restart openresty
  tags: [nginx, letsencrypt]

- name: "Remove httponly config from sites-available for {{ site_name }}"
  ansible.builtin.file:
    path: "/etc/nginx/sites-available/{{ site_name }}"
    state: absent
  become: true
  when: nginx_need_certs
  notify: Restart openresty
  tags: [nginx, letsencrypt]

# Redirected domains: a certificate each, issued through the :80 default_server's
# webroot. A block is rendered only for a domain whose certificate exists, so a
# failed issuance cannot stop nginx. See docs/logbook.md.
- name: Check which redirected domains already have a certificate
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ item }}/fullchain.pem"
  become: true
  loop: "{{ site_alias_domains }}"
  register: nginx_alias_cert_stat
  when: not is_molecule_test | default(false) and inventory_hostname in groups['production']
  tags: [nginx, letsencrypt]

- name: Generate Let's Encrypt certificates for redirected domains
  ansible.builtin.command: >
    certbot certonly --non-interactive --agree-tos --no-eff-email
    --email {{ admin_email }}
    -a webroot --webroot-path /var/www/letsencrypt
    --cert-name {{ item.item }}
    -d {{ item.item }} -d www.{{ item.item }}
  become: true
  loop: "{{ nginx_alias_cert_stat.results | default([]) }}"
  when:
    - item.stat is defined
    - not item.stat.exists
    - test is not defined
  register: nginx_alias_certbot
  failed_when: false
  changed_when: nginx_alias_certbot.rc == 0
  tags: [nginx, letsencrypt]

- name: Check which redirected domains have a certificate now
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ item }}/fullchain.pem"
  become: true
  loop: "{{ site_alias_domains }}"
  register: nginx_alias_cert_ready
  when: not is_molecule_test | default(false) and inventory_hostname in groups['production']
  tags: [nginx, nginx-snippets, letsencrypt]

- name: Keep only the redirected domains nginx can serve
  ansible.builtin.set_fact:
    nginx_alias_domains: >-
      {{ nginx_alias_cert_ready.results | default([])
         | selectattr('stat', 'defined') | selectattr('stat.exists')
         | map(attribute='item') | list }}
  tags: [nginx, nginx-snippets, letsencrypt]

- name: Say which redirected domains got no certificate
  ansible.builtin.debug:
    msg: "No certificate for {{ item }}: its redirect is left out. Is its DNS pointing here?"
  loop: "{{ site_alias_domains | difference(nginx_alias_domains) }}"
  when: not is_molecule_test | default(false) and inventory_hostname in groups['production']
  tags: [nginx, letsencrypt]

- name: "Add ssl config to nginx sites-available for {{ site_name }}"
  ansible.builtin.template:
    src: nginx.ssl.conf
    dest: "/etc/nginx/sites-available/{{ site_name }}"
    owner: root
    group: root
    mode: '0640'
  become: true
  when: not is_molecule_test | default(false) and inventory_hostname in groups['production']
  tags: [nginx, nginx-snippets, letsencrypt]

- name: "Add symlink to nginx sites-enabled (SSL) for {{ site_name }}"
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ site_name }}"
    dest: "/etc/nginx/sites-enabled/{{ site_name }}"
    state: link
    owner: root
    group: root
    mode: '0640'
  become: true
  notify: Restart openresty
  tags: [nginx, letsencrypt]
