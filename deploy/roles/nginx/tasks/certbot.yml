---
- name: Create virtualenv for Certbot
  ansible.builtin.command: python3 -m venv /opt/certbot/
  args:
    creates: /opt/certbot/
  become: true
  tags: [certbot]

- name: Install Certbot and Certbot-Nginx
  ansible.builtin.pip:
    name: "{{ item }}"
    executable: /opt/certbot/bin/pip
    state: present
  become: true
  loop:
    - certbot
    - certbot-nginx
  tags: [certbot]

- name: Look for an existing /usr/bin/certbot
  ansible.builtin.stat:
    path: /usr/bin/certbot
    follow: false
  register: nginx_certbot_bin
  tags: [certbot]

# A regular file is Debian's certbot package, which renews (certbot.timer): keep it
- name: Create symbolic link for Certbot
  ansible.builtin.file:
    src: /opt/certbot/bin/certbot
    dest: /usr/bin/certbot
    owner: root
    group: root
    state: link
  become: true
  when: not (nginx_certbot_bin.stat.isreg | default(false))
  tags: [certbot]
