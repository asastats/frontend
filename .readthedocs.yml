# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

submodules:
  include: all
  recursive: true

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    nodejs: "24"
  jobs:
    pre_build:
      # Use npm ci for reproducible installs (uses package-lock.json)
      - npm --prefix wallet install
      # Generate TypeDoc docs
      - npm --prefix wallet run build:docs

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py
  # You can configure Sphinx to use a different builder, for instance use the dirhtml builder for simpler URLs
  # builder: "dirhtml"
  # Fail on all warnings to avoid broken references.
  #
  # Turned on 2026-09-22, once the build was clean *here* - which is the part
  # worth remembering. A developer has `website/.env`, Read the Docs does not,
  # and the same commit produced one warning locally and thirteen there:
  # `api.views`, `core.views`, `walletauth.views` and every `urls` module were
  # undocumented on the published site and fine on every laptop.
  #
  # `docs/conf.py` now supplies placeholders for the settings those modules
  # need, so the two builds agree. Before changing that block, check the build
  # with `website/.env` moved aside - otherwise this flag protects the one
  # environment that was never broken.
  fail_on_warning: true

# Optionally build your docs in additional formats such as PDF and ePub
# formats:
#   - pdf
#   - epub

# Optional but recommended, declare the Python requirements required
# to build your documentation
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
python:
  install:
    - requirements: website/requirements/development.txt
