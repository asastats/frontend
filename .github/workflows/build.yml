name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  main:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: website_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r website/requirements/development.txt

      - name: Create env file
        run: |
          touch website/.env
          echo SECRET_KEY="mysecretkey" >> website/.env
          echo DATABASE_NAME="website_db" >> website/.env
          echo DATABASE_USER="postgres" >> website/.env
          echo DATABASE_PASSWORD="postgres" >> website/.env
          echo REDIS_PORT_LOCAL="6379" >> website/.env
          echo PGPASSFILE="" >> website/.env

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -p 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Collect static files
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
        run: |
          python website/manage.py collectstatic --noinput

      - name: Run main Django project unit tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/website_db
        run: |
          pytest -k "not integration_tests" --cov=. --cov-report=xml:coverage-main.xml --cov-report=term-missing

      - name: Run widgets submodule tests
        env:
          PYTHONPATH: website
          DJANGO_SETTINGS_MODULE: config.settings.development
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/website_db
          COVERAGE_RCFILE: website/widgets/.coveragerc
        run: |
          pytest website/widgets -c website/widgets/pytest.ini --cov=widgets --cov-report=xml:coverage-widgets.xml --cov-report=term-missing

      - name: Upload main project coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-main.xml
          flags: main-project
          name: main-coverage

      - name: Upload widgets coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-widgets.xml
          flags: widgets-python
          name: widgets-coverage
          recurse_submodules: true

  frontend:
    runs-on: ubuntu-latest
    needs: main

    steps:
      - name: Checkout code and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "wallet/package-lock.json"

      - name: Install dependencies (wallet)
        run: |
          cd wallet
          npm ci

      - name: Run wallet Typescript tests with coverage
        run: |
          cd wallet
          npm run test:coverage

      - name: Upload wallet Typescript coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: wallet/coverage
          flags: wallet-typescript
          name: wallet-coverage

      - name: Install dependencies (website)
        run: |
          cd website
          npm install

      - name: Run website's tests with coverage
        run: |
          cd website
          npm run test:coverage

      - name: Upload website's Javascript coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: website/javascript_tests/coverage
          flags: website-javascript
          name: website-coverage

  # **The widgets submodule's JavaScript, at the commit this repo pins.**
  #
  # It was tested nowhere here. The submodule's own `test.yml` runs on pushes
  # to *that* repo, so a frontend build that moved the submodule pointer never
  # ran a line of the JavaScript it was integrating - which is the half of the
  # widgets code this repo actually ships.
  #
  # **Why this is not `uses: <owner>/widgets/.github/workflows/test.yml@ref`.**
  # A reusable workflow is referenced by a static ref, and `uses:` takes no
  # expressions - so the call would test that repo's `main` while this build is
  # integrating whatever SHA the submodule points at. Testing a different
  # commit than the one being built is worse than not testing it, because the
  # tick would say otherwise. Run in place, against the checkout.
  #
  # The matrix is **discovered, not listed**. Two widgets with real suites sat
  # outside the submodule's own hand-written list for months, and a second
  # hand-written list here would drift from that one as well. A widget is in
  # CI when it declares a `test` script, which is the same condition that makes
  # it runnable at all.
  widgets-discover:
    runs-on: ubuntu-latest
    needs: main
    outputs:
      widgets: ${{ steps.find.outputs.widgets }}

    steps:
      - name: Checkout code and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Find widgets that declare a test script
        id: find
        run: |
          widgets=$(node -e '
            const fs = require("fs");
            const path = require("path");
            const root = "website/widgets/inhouse";
            const names = fs
              .readdirSync(root)
              .filter((name) => {
                const manifest = path.join(root, name, "package.json");
                if (!fs.existsSync(manifest)) return false;
                const data = JSON.parse(fs.readFileSync(manifest, "utf8"));
                return Boolean(data.scripts && data.scripts.test);
              })
              .sort();
            if (!names.length) {
              console.error("no widget declares a test script");
              process.exit(1);
            }
            console.log(JSON.stringify(names));
          ')
          echo "found: $widgets"
          echo "widgets=$widgets" >> "$GITHUB_OUTPUT"

  widgets:
    runs-on: ubuntu-latest
    needs: widgets-discover

    strategy:
      # Every widget is reported rather than the run stopping at the first
      # failure: "which of them broke" is what a red build has to answer.
      fail-fast: false
      matrix:
        widget: ${{ fromJSON(needs.widgets-discover.outputs.widgets) }}

    name: widgets ${{ matrix.widget }} JavaScript

    steps:
      - name: Checkout code and submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          # Per widget: each keeps its own lockfile, and one shared path would
          # key every job's cache on a single widget's dependencies.
          cache-dependency-path: "website/widgets/inhouse/${{ matrix.widget }}/package-lock.json"

      - name: Install dependencies
        working-directory: website/widgets/inhouse/${{ matrix.widget }}
        # `npm ci`, so a lockfile that has drifted from its `package.json`
        # fails here rather than quietly resolving something else.
        run: npm ci

      - name: Run ${{ matrix.widget }} JavaScript tests with coverage
        working-directory: website/widgets/inhouse/${{ matrix.widget }}
        # Coverage and its threshold come from each widget's own `jest` block,
        # so they are enforced by the config rather than by a flag somebody has
        # to remember here.
        run: npm run test

      - name: Upload ${{ matrix.widget }} coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: website/widgets/inhouse/${{ matrix.widget }}/tests/javascript/coverage
          flags: ${{ matrix.widget }}-javascript
          name: ${{ matrix.widget }}-coverage
