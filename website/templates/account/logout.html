{% extends 'base_tw.html' %}
{% load i18n %}
{% load core_extras %}
{% block content %}
<div class="mx-auto max-w-md text-center">
    <h2 class="text-2xl font-semibold">Log out</h2>
    <p class="mt-3">Are you sure you want to log out?</p>

    <form method="post" action="{% url 'account_logout' %}">
      {% csrf_token %}
      {% if redirect_field_value %}
      <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
      {% endif %}
      <div class="mt-6">
          <button id="id_confirm_logout" class="primaryAction btn btn-primary" type="submit">Logout</button>
      </div>
    </form>
</div>
{% endblock %}
