{% load core_extras %}
{% comment %} Shown while the engine is still building the report. `#back` is a `tax.js`
   hook.
{% endcomment %}
<div class="mx-auto max-w-2xl text-center">
  <h4 class="text-xl font-semibold tracking-tight">Your CSV report is being processed&hellip;</h4>
  <div class="mt-6">
    {% if bundle %}
    <a class="btn btn-primary" id="back" href="{% url 'bundle' url_value %}" title="Evaluate bundle">Back</a>
    {% else %}
    <a class="btn btn-primary" id="back" href="{% url 'address' url_value %}" title="Evaluate address">Back</a>
    {% endif %}
  </div>
</div>
