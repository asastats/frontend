{% comment %} Pull down to refresh, app only. `#pull-refresh` and its `dragging`/`ready`/`spinning` classes are set by pullrefresh.js. See docs/logbook.md. {% endcomment %}
{% load static %}{% if APP_CLIENT %}<style>
  #pull-refresh { position: fixed; top: calc(env(safe-area-inset-top) - 2.75rem); left: 50%; z-index: 9998; display: flex; align-items: center; justify-content: center; width: 2.5rem; height: 2.5rem; border-radius: 9999px; background: var(--color-base-100); color: var(--color-base-content); box-shadow: 0 2px 8px rgb(0 0 0 / .25); opacity: 0; transform: translate(-50%, 0); transition: transform .2s, opacity .2s; pointer-events: none; }
  #pull-refresh.dragging { transition: none; }
  #pull-refresh.ready { color: var(--color-primary); }
  #pull-refresh.spinning svg { animation: pull-refresh-spin .8s linear infinite; }
  @keyframes pull-refresh-spin { to { transform: rotate(360deg); } }
</style>
<script src="{% static 'js/pullrefresh.js' %}"></script>{% endif %}
