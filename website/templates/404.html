<!doctype html>
{% load static %}<html lang="en"{% if APP_CLIENT %} class="in-app" data-app-platform="{{ APP_CLIENT.platform }}"{% endif %}>
<head>
    <meta charset="utf-8">
    <title>Page not found</title>
    <meta name="description" content="{{ WEBSITE_URL }} error page">
    <meta name="keywords" content="error">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    {% include "snippets/error_style.html" %}
</head>

<body>
    <main class="panel">
        <a class="brand" href="{{ WEBSITE_URL }}"><img src="/logo400.png" width="400" height="241" alt="Go to {{ WEBSITE_URL }} index page"></a>
        <h1>Page not found</h1>
        <p>Sorry, but the page you were trying to view does not exist.</p>
        <a class="action" href="{{ WEBSITE_URL }}">Go to the home page</a>
    </main>
    {# app.js handles Android Back; without it the app is stuck here (docs/logbook.md) #}
    {% if APP_CLIENT %}<script type="module" src="{% static 'js/app.js' %}"></script>{% endif %}
</body>

</html>
<!-- IE needs 512+ bytes: http://blogs.msdn.com/b/ieinternals/archive/2010/08/19/http-error-pages-in-internet-explorer.aspx -->
