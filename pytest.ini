[pytest]
pythonpath =
    website
    website/permissiondapp/dapp
# Kept for tooling that reads it, but it is NOT what selects the settings:
# the frontend venv's activate script exports DJANGO_SETTINGS_MODULE, and
# pytest-django gives that environment variable precedence over this ini key.
# The --ds flag in addopts below outranks both, so the suite gets its own
# settings whether or not the venv is active.
DJANGO_SETTINGS_MODULE = config.settings.automated_tests
python_files = tests.py test_*.py *_tests.py
junit_family=legacy
asyncio_mode=auto
asyncio_default_fixture_loop_scope=function
addopts =
    --ds=config.settings.automated_tests
    --import-mode=importlib
    --ignore-glob=website/permissiondapp
    --ignore-glob=website/widgets
    -p no:warnings
norecursedirs = thumbnails
